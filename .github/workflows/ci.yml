name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks and tests
        run: npm run ci

      - name: Audit production dependencies
        # Fail only on high/critical. Moderate transitive advisories (e.g. Sentry's
        # OpenTelemetry deps) otherwise block unrelated PRs; review those manually.
        run: npm audit --omit=dev --audit-level=high
