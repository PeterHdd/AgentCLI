<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCLI</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sessions" class="sessions" aria-label="Sessions">
        <div class="sessions-head">
          <span>sessions</span>
          <button id="close-sessions" title="Close sessions">×</button>
        </div>
        <div class="sessions-search">
          <input id="session-search" type="search" autocomplete="off" spellcheck="false" placeholder="filter sessions" />
        </div>
        <div id="session-list" class="session-list"></div>
        <div id="session-preview" class="session-preview"></div>
      </aside>
      <main class="terminal-wrap">
        <div class="tabbar">
          <div id="tabs" class="tabs" aria-label="Terminal tabs"></div>
          <div class="tabbar-actions">
            <button id="new-tab" class="tabbar-button" type="button" title="New tab (⌘T)" aria-label="New tab">+</button>
            <button id="sessions-toggle" class="tabbar-button" type="button" title="Toggle sessions (⌘B)" aria-label="Toggle sessions" aria-pressed="false">☰</button>
            <button id="palette-open" class="tabbar-button" type="button" title="Command palette (⌘K)" aria-label="Command palette">⌘K</button>
            <button id="scratchpad-toggle" class="tabbar-button scratchpad-toggle" type="button" title="Scratchpad (⌘E)" aria-label="Scratchpad" aria-pressed="false">✎</button>
          </div>
        </div>
        <div id="hint-bar" class="hint-bar">
          <span>Tips: <b>⌘K</b> commands · <b>⌘B</b> sessions · <b>⌘T</b> new tab · <b>⌘E</b> scratchpad</span>
          <button id="hint-dismiss" type="button" title="Dismiss tips" aria-label="Dismiss tips">×</button>
        </div>
        <section id="scratchpad" class="scratchpad collapsed" aria-label="Prompt scratchpad">
          <div class="scratchpad-head">
            <span>scratchpad</span>
            <div>
              <button id="scratchpad-send" type="button">send</button>
              <button id="scratchpad-pair" type="button">pair</button>
              <button id="scratchpad-close" type="button">×</button>
            </div>
          </div>
          <textarea id="scratchpad-input" spellcheck="true" placeholder="Draft prompt here. Voice dictation inserts here when open."></textarea>
        </section>
        <div id="terminal" class="terminal-stack"></div>
        <textarea id="keyboard-capture" aria-label="Keyboard capture" autofocus></textarea>
      </main>
    </div>
    <div id="palette" class="palette" aria-hidden="true">
      <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <input id="palette-input" type="search" autocomplete="off" spellcheck="false" placeholder="command" aria-label="Filter commands" />
        <div id="palette-list" class="palette-list" role="listbox"></div>
      </div>
    </div>
    <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <div id="dialog" class="dialog" aria-hidden="true">
      <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="dialog-head"><span id="dialog-title"></span></div>
        <div id="dialog-body" class="dialog-body"></div>
        <div class="dialog-actions">
          <button id="dialog-cancel" class="dialog-button" type="button">Cancel</button>
          <button id="dialog-confirm" class="dialog-button primary" type="button">OK</button>
        </div>
      </div>
    </div>
    <div id="theme-editor" class="theme-editor" aria-hidden="true">
      <div class="theme-panel">
        <div class="theme-head">
          <span>Colors</span>
          <button id="theme-close" type="button">×</button>
        </div>
        <div class="theme-targets" id="theme-targets"></div>
        <div class="theme-controls">
          <label>
            <span>Hue</span>
            <input id="theme-hue" type="range" min="0" max="360" step="1" />
            <output id="theme-hue-value"></output>
          </label>
          <label>
            <span>Saturation</span>
            <input id="theme-saturation" type="range" min="0" max="100" step="1" />
            <output id="theme-saturation-value"></output>
          </label>
          <label>
            <span>Brightness</span>
            <input id="theme-brightness" type="range" min="0" max="100" step="1" />
            <output id="theme-brightness-value"></output>
          </label>
        </div>
        <div class="theme-actions">
          <button id="theme-reset" type="button">Restore Profile Color</button>
          <button id="theme-done" type="button">Done</button>
        </div>
      </div>
    </div>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./lib/colors.js"></script>
    <script src="./lib/format.js"></script>
    <script src="./lib/agent.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
